services:
  secondhello:
    build: .
    restart: unless-stopped
    ports:
      - "${SECONDHELLO_PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      SECONDHELLO_ENV: production
      SECONDHELLO_HOST: 0.0.0.0
      SECONDHELLO_PORT: 8765
      SECONDHELLO_WEB_ROOT: /app/web/dist
      SECONDHELLO_AUTH_TOKEN: ${SECONDHELLO_AUTH_TOKEN:?Set SECONDHELLO_AUTH_TOKEN in .env}
      SECONDHELLO_CORS_ORIGINS: ${SECONDHELLO_CORS_ORIGINS:-}
      SECONDHELLO_MEMORY_FILE: /data/memory.json
    volumes:
      - secondhello_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional local MongoDB for a fully local deployment. Atlas remains the
  # recommended durable store when a managed database is available.
  mongo:
    image: mongo:8
    profiles: ["mongo"]
    restart: unless-stopped
    volumes:
      - secondhello_mongo:/data/db

volumes:
  secondhello_data:
  secondhello_mongo:
